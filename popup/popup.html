<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oscure UTP</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="logo-group">
        <div class="logo-icon">
          <img src="moon-logo.png" alt="Oscure UTP" class="logo-img">
        </div>
        <div>
          <h1 class="brand-title">Oscure UTP</h1>
          <p class="brand-subtitle">Modo Oscuro Inteligente</p>
        </div>
      </div>
      <div id="siteBadge" class="site-badge"><span id="siteBadgeText">EXTERNO</span></div>
    </header>

    <!-- Master Switch Card -->
    <div class="toggle-card">
      <div class="toggle-info">
        <span class="toggle-label">Modo Oscuro</span>
        <span id="toggleStatusText" class="toggle-sub">Activado</span>
      </div>
      <label class="switch" for="themeToggle">
        <input type="checkbox" id="themeToggle" checked>
        <span class="slider"></span>
      </label>
    </div>

    <!-- Hide Banner Toggle Card -->
    <div class="toggle-card">
      <div class="toggle-info">
        <span class="toggle-label">Ocultar Publicidad</span>
        <span id="bannerStatusText" class="toggle-sub">Oculto</span>
      </div>
      <label class="switch" for="bannerToggle">
        <input type="checkbox" id="bannerToggle" checked>
        <span class="slider"></span>
      </label>
    </div>

    <!-- Accent Color Selector Card -->
    <div class="controls-card accent-card">
      <div class="control-header">
        <label class="card-label">Color de Acento</label>
        <span id="accentName" class="val-badge">Cian</span>
      </div>
      <div class="accent-palette" id="accentPalette">
        <button type="button" class="color-dot" data-color="#5865F2" data-name="Índigo" style="--dot-color: #5865F2;" title="Índigo"></button>
        <button type="button" class="color-dot active" data-color="#00C2FF" data-name="Cian" style="--dot-color: #00C2FF;" title="Cian"></button>
        <button type="button" class="color-dot" data-color="#00D084" data-name="Esmeralda" style="--dot-color: #00D084;" title="Esmeralda"></button>
        <button type="button" class="color-dot" data-color="#9353D3" data-name="Púrpura" style="--dot-color: #9353D3;" title="Púrpura"></button>
        <button type="button" class="color-dot" data-color="#EC4899" data-name="Rosa" style="--dot-color: #EC4899;" title="Rosa"></button>
        <button type="button" class="color-dot" data-color="#FF9800" data-name="Ámbar" style="--dot-color: #FF9800;" title="Ámbar"></button>
        <label class="color-picker-wrapper" title="Color personalizado">
          <input type="color" id="customColorPicker" value="#00C2FF">
          <span class="picker-swatch" id="customSwatch">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.01-.23-.26-.38-.61-.38-.99 0-.83.67-1.5 1.5-1.5H16c3.31 0 6-2.69 6-6 0-4.97-4.48-9-10-9z" fill="#f5ad7e"/>
              <circle cx="6.5" cy="11.5" r="1.5" fill="#f43f5e"/>
              <circle cx="9.5" cy="7.5" r="1.5" fill="#8b5cf6"/>
              <circle cx="14.5" cy="7.5" r="1.5" fill="#3b82f6"/>
              <circle cx="17.5" cy="11.5" r="1.5" fill="#00c2ff"/>
              <circle cx="16" cy="16" r="1.6" fill="#182236"/>
            </svg>
          </span>
        </label>
      </div>
    </div>

    <!-- Sliders Section -->
    <div class="controls-card sliders-card">
      <div class="control-row">
        <div class="control-header">
          <label for="brightnessSlider" class="slider-label">Brillo</label>
          <span id="brightnessVal" class="val-badge">100%</span>
        </div>
        <input type="range" id="brightnessSlider" min="70" max="120" value="100" class="range-slider">
      </div>

      <div class="control-row">
        <div class="control-header">
          <label for="contrastSlider" class="slider-label">Contraste</label>
          <span id="contrastVal" class="val-badge">100%</span>
        </div>
        <input type="range" id="contrastSlider" min="80" max="130" value="100" class="range-slider">
      </div>

      <button id="resetBtn" class="reset-btn" type="button" title="Restablecer ajustes originales">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
          <path d="M3 3v5h5"></path>
        </svg>
        Restablecer ajustes
      </button>
    </div>

    <!-- Footer info -->
    <footer class="popup-footer">
      <div class="shortcut-hint">
        <span class="kbd">Alt</span>
        <span class="plus">+</span>
        <span class="kbd">Shift</span>
        <span class="plus">+</span>
        <span class="kbd">D</span>
        <span class="hint-text">para alternar rápido</span>
      </div>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
